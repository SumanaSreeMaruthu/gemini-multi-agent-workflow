<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Workflow</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f7f9fc}main,article{padding:20px;background:white;margin:14px 0;border-radius:12px}textarea{width:95%;height:100px}textarea,button{font:inherit;padding:10px}button{background:#1746a2;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap}</style></head><body><h1>Gemini Planning & Review Workflow</h1><p>Two sequential Gemini prompts: planner and reviewer. Set GEMINI_API_KEY before starting.</p><main><form id="form"><textarea id="task" required placeholder="Describe a synthetic task"></textarea><button>Run workflow</button></form><p id="message" role="status"></p></main><section id="results"></section><script>
const api='/api/v1/workflows';
async function request(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
async function refresh(){try{const records=await request(api);const box=document.getElementById('results');box.replaceChildren();for(const record of records){const card=document.createElement('article');const h=document.createElement('h3');h.textContent='#'+record.id+' '+record.task;const pre=document.createElement('pre');pre.textContent=record.result;card.append(h,pre);box.append(card)}}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Running two Gemini requests...';try{await request(api,{method:'POST',body:JSON.stringify({task:document.getElementById('task').value})});m.textContent='Completed';await refresh()}catch(error){m.textContent=error.message}};refresh();
</script></body></html>
